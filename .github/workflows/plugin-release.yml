# Shared release for every plugin branch.
#
# Called from a plugin branch's own caller on a `<plugin>-v*` tag push. Tags are
# prefixed with the plugin name because one repository carries several plugins,
# each on its own branch.
#
# Nothing is published to a registry: the artifact is a prebuilt tarball on the
# GitHub Release, which installs with no credentials and runs no build scripts
# on the installing machine. GitHub Packages would require every installer to
# configure a PAT even for a public package.
name: plugin-release

on:
  workflow_call:
    inputs:
      plugin:
        description: Plugin name; must match the tag prefix.
        type: string
        required: true

permissions:
  contents: write

jobs:
  release:
    name: ${{ inputs.plugin }} · release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch shared scripts from main
        uses: actions/checkout@v7
        with:
          ref: main
          path: .compat
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: corepack enable pnpm
      - run: npm ci

      - name: Check the tag matches the manifest
        env:
          PLUGIN: ${{ inputs.plugin }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p 'require("./package.json").version')
          expected="${PLUGIN}-v${version}"
          if [ "$TAG" != "$expected" ]; then
            echo "tag $TAG does not match package.json ($expected)" >&2
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test
      - name: Verify every supported DSH release
        run: node .compat/scripts/compat-verify.mjs --project .
      # npm names the tarball after the version; the asset drops it so one
      # URL can serve every release.
      - name: Build the versionless tarball
        run: |
          set -euo pipefail
          npm pack --silent >/dev/null
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          mv "${name}-${version}.tgz" "${name}.tgz"
          ls -l "${name}.tgz"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN: ${{ inputs.plugin }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          node .compat/scripts/release-notes.mjs --project . --plugin "$PLUGIN" --tag "$TAG" --out notes.md

          # The immutable record of this version.
          gh release create "$TAG" --title "$PLUGIN $version" --notes-file notes.md "${name}.tgz"

          # The rolling pointer the install URL uses. Recreated rather than
          # edited so its tag follows the released commit; --latest=false
          # leaves GitHub's "Latest" badge on the versioned release.
          gh release delete "${PLUGIN}-latest" --yes --cleanup-tag || true
          gh release create "${PLUGIN}-latest" \
            --target "$GITHUB_SHA" \
            --title "$PLUGIN latest ($version)" \
            --notes-file notes.md \
            --latest=false \
            "${name}.tgz"

      # plugins.json is what the plugin-hub settings page reads to tell an
      # installed version from the available one, so it has to name what the
      # rolling release now holds. `.compat` is already a checkout of main.
      - name: Record the release in the plugin catalogue
        working-directory: .compat
        env:
          PLUGIN: ${{ inputs.plugin }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          result=$(node scripts/update-manifest.mjs --plugin "$PLUGIN" --project ..)
          echo "catalogue: $result"
          if [ "$result" = 'updated' ]; then
            git add plugins.json
            git commit -m "$PLUGIN: 清单记录 $(node -p 'require("../package.json").version')"
            # Another plugin's release may have pushed main in the meantime.
            git pull --rebase --quiet origin main
            git push origin HEAD:main
          fi
